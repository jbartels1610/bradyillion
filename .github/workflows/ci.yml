name: Validate Bradyillion
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install from a clean production environment, as Render does
        run: npm ci --no-audit --no-fund
        env:
          NODE_ENV: production
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run data:audit
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: playwright-report
